name: Sync fork with upstream

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-fork-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out fork
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch original repository
        run: |
          git remote add upstream https://github.com/VdustR/pokebonk-offline.git
          git fetch upstream main

      - name: Merge upstream changes without overwriting fork changes
        id: merge
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fork is already current."
            exit 0
          fi

          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "::error::Upstream changes conflict with local fork changes. No files were overwritten; resolve the conflict manually."
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push synchronized main
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Start Windows build and release
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-releases.yml --ref main
